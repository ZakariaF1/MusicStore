<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="title desc">
  <title id="title">C4 Context  Music Store</title>
  <desc id="desc">Operator uses Music Store Web UI; UI calls Music Store API; API uses MySQL Chinook database.</desc>
  <rect width="880" height="420" fill="#f7f8fa"/>
  <text x="24" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1a1a1a">C4 Context  Music Store</text>
  <rect x="60" y="160" width="140" height="80" rx="8" fill="#08427b" stroke="#03315a"/>
  <text x="130" y="195" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#fff">Operator</text>
  <text x="130" y="215" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#cde">Person</text>
  <rect x="320" y="90" width="240" height="220" rx="10" fill="#1168bd" stroke="#0b4884"/>
  <text x="440" y="130" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff">Music Store System</text>
  <text x="440" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e8f1fa">Software System</text>
  <text x="440" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#fff">Catalog CRUD for Chinook</text>
  <text x="440" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#fff">artists, albums, tracks,</text>
  <text x="440" y="240" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#fff">customers, invoices, &</text>
  <rect x="680" y="160" width="150" height="80" rx="8" fill="#438dd5" stroke="#2b6fa8"/>
  <text x="755" y="195" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#fff">MySQL</text>
  <text x="755" y="215" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#e8f1fa">chinookdatabase</text>
  <line x1="200" y1="200" x2="320" y2="200" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="260" y="188" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#333">Uses</text>
  <line x1="560" y1="200" x2="680" y2="200" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="620" y="188" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#333">Reads/Writes</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
</svg>
