<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
  <title id="title">Deployment  local development</title>
  <desc id="desc">Developer workstation runs IIS Express or Kestrel for API and WebApp; MySQL on localhost or Docker.</desc>
  <rect width="900" height="480" fill="#f7f8fa"/>
  <text x="24" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1a1a1a">Deployment  local development</text>
  <rect x="50" y="70" width="800" height="360" rx="12" fill="#ffffff" stroke="#1168bd" stroke-width="2"/>
  <text x="70" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1168bd">Developer workstation</text>
  <rect x="80" y="130" width="220" height="100" rx="8" fill="#1168bd"/>
  <text x="190" y="170" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#fff">MusicStoreWebApp</text>
  <text x="190" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#e8f1fa">IIS Express :44331</text>
  <text x="190" y="208" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#e8f1fa">or Kestrel :5002/:5003</text>
  <rect x="340" y="130" width="220" height="100" rx="8" fill="#1168bd"/>
  <text x="450" y="170" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#fff">MusicStore API</text>
  <text x="450" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#e8f1fa">IIS Express :44333</text>
  <text x="450" y="208" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#e8f1fa">or Kestrel :5000/:5001</text>
  <rect x="600" y="130" width="220" height="100" rx="8" fill="#438dd5"/>
  <text x="710" y="170" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#fff">MySQL</text>
  <text x="710" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#e8f1fa">localhost:3306</text>
  <text x="710" y="208" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#e8f1fa">or Docker container</text>
  <text x="70" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333">Config: MusicStoreUrl in web appsettings ’ API base URL</text>
  <text x="70" y="305" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333">Config: ChinookDatabaseConnection in API appsettings ’ MySQL</text>
  <text x="70" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#666">No cloud deployment is defined for this thesis project yet.</text>
  <text x="70" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#666">Production hosting is Out of Scope until chosen.</text>
</svg>
