<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520">
  <title>C4 Containers - Music Store</title>
  <desc>Browser to MusicStoreWebApp to MusicStore API to MySQL; MusicStore.Api client library used by the web app.</desc>
  <defs>
    <marker id="arrow-containers" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>
  <rect width="980" height="520" fill="#f7f8fa"/>
  <text x="24" y="36" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1a1a1a">C4 Containers - Music Store</text>
  <rect x="40" y="220" width="120" height="70" rx="8" fill="#08427b"/>
  <text x="100" y="250" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff">Browser</text>
  <text x="100" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#ccddee">Person</text>
  <rect x="220" y="120" width="200" height="280" rx="10" fill="#1168bd"/>
  <text x="320" y="155" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff">MusicStoreWebApp</text>
  <text x="320" y="175" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#e8f1fa">ASP.NET Core MVC</text>
  <text x="320" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#ffffff">Razor + Kendo grids</text>
  <text x="320" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#ffffff">Calls API via</text>
  <text x="320" y="250" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#ffffff">MusicStore.Api</text>
  <rect x="500" y="120" width="220" height="280" rx="10" fill="#1168bd"/>
  <text x="610" y="155" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff">MusicStore API</text>
  <text x="610" y="175" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#e8f1fa">ASP.NET Core 2.1</text>
  <text x="610" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#ffffff">Controllers /api/v1/*</text>
  <text x="610" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#ffffff">Services + EF Core</text>
  <text x="610" y="250" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#ffffff">Domain + Repositories</text>
  <rect x="800" y="220" width="140" height="80" rx="8" fill="#438dd5"/>
  <text x="870" y="255" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff">MySQL 8</text>
  <text x="870" y="275" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#e8f1fa">chinookdatabase</text>
  <line x1="160" y1="255" x2="220" y2="255" stroke="#333333" stroke-width="2" marker-end="url(#arrow-containers)"/>
  <text x="190" y="244" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#333333">HTTPS</text>
  <line x1="420" y1="255" x2="500" y2="255" stroke="#333333" stroke-width="2" marker-end="url(#arrow-containers)"/>
  <text x="460" y="244" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#333333">HTTPS JSON</text>
  <line x1="720" y1="255" x2="800" y2="255" stroke="#333333" stroke-width="2" marker-end="url(#arrow-containers)"/>
  <text x="760" y="244" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#333333">EF / MySQL</text>
</svg>
