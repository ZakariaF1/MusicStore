<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420">
  <title>Sequence - list employees</title>
  <desc>Browser requests Employee Index; WebApp calls API GET /api/v1/employees; API queries MySQL and returns JSON.</desc>
  <defs>
    <marker id="arrow-sequence" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>
  <rect width="920" height="420" fill="#f7f8fa"/>
  <text x="24" y="36" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1a1a1a">Sequence - List employees</text>
  <text x="100" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#1a1a1a">Browser</text>
  <text x="320" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#1a1a1a">WebApp</text>
  <text x="540" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#1a1a1a">API</text>
  <text x="760" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#1a1a1a">MySQL</text>
  <line x1="100" y1="95" x2="100" y2="390" stroke="#999999" stroke-dasharray="4 4"/>
  <line x1="320" y1="95" x2="320" y2="390" stroke="#999999" stroke-dasharray="4 4"/>
  <line x1="540" y1="95" x2="540" y2="390" stroke="#999999" stroke-dasharray="4 4"/>
  <line x1="760" y1="95" x2="760" y2="390" stroke="#999999" stroke-dasharray="4 4"/>
  <line x1="100" y1="140" x2="320" y2="140" stroke="#1168bd" stroke-width="2" marker-end="url(#arrow-sequence)"/>
  <text x="210" y="130" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1168bd">GET /Employee</text>
  <line x1="320" y1="190" x2="540" y2="190" stroke="#1168bd" stroke-width="2" marker-end="url(#arrow-sequence)"/>
  <text x="430" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1168bd">GET /api/v1/employees</text>
  <line x1="540" y1="240" x2="760" y2="240" stroke="#1168bd" stroke-width="2" marker-end="url(#arrow-sequence)"/>
  <text x="650" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1168bd">SELECT employees</text>
  <line x1="760" y1="280" x2="540" y2="280" stroke="#333333" stroke-width="2" marker-end="url(#arrow-sequence)"/>
  <text x="650" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333333">rows</text>
  <line x1="540" y1="320" x2="320" y2="320" stroke="#333333" stroke-width="2" marker-end="url(#arrow-sequence)"/>
  <text x="430" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333333">200 JSON DTO[]</text>
  <line x1="320" y1="360" x2="100" y2="360" stroke="#333333" stroke-width="2" marker-end="url(#arrow-sequence)"/>
  <text x="210" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333333">HTML grid</text>
</svg>
